# The test suite is deliberately absent: it runs in the `quality` workflow,
# not on every commit.
default_install_hook_types:
  - pre-commit
  - commit-msg

# Without this, every hook also runs at commit-msg, against the message file.
default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        exclude: ^(.*/)?(package-lock\.json|uv\.lock|Cargo\.lock)$
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        # Warning-level rules are printed and then ignored without this.
        args:
          - --strict

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 3565c66f2d58f34041a13ebc6d4132c008e52a74  # frozen: 44.257.9
    hooks:
      - id: renovate-config-validator
        # Without --no-global, the file names the hook passes are checked as
        # self-hosted global config, and repo-config problems slip through.
        args:
          - --strict
          - --no-global

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 39478bf2c099a58683d3f1aedf675105318b078d  # frozen: 0.39.0
    hooks:
      - id: check-taskfile

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10  # frozen: v0.17.6
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 81f5f4cd875cc74ecfdfae601ae47d3fd200ad8d  # frozen: 0.13.10
    hooks:
      - id: uv-lock
        files: ^pollen-py/(pyproject\.toml|uv\.lock)$
        args:
          - --project
          - pollen-py

  - repo: local
    hooks:
      - id: no-co-authors
        name: no co-authors in commit message
        entry: '^\s*co-authored-by:|\bgenerated with\b'
        language: pygrep
        args:
          - --ignore-case
        stages:
          - commit-msg

      - id: mise-fmt
        name: mise fmt
        entry: mise fmt
        language: system
        files: ^mise\.toml$
        pass_filenames: false

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check --
        language: system
        types:
          - rust

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        pass_filenames: false
        types:
          - rust

      - id: pyright
        name: pyright the Python bindings
        # The stubs and tests are checked against the sources, so the
        # extension itself is not built.
        entry: uv run --directory pollen-py --only-group dev pyright
        language: system
        pass_filenames: false
        files: ^pollen-py/.*\.pyi?$

      - id: license-copy
        name: the Python package's LICENSE matches the repository's
        entry: cmp LICENSE pollen-py/LICENSE
        language: system
        pass_filenames: false
        files: ^(LICENSE|pollen-py/LICENSE)$

      - id: pollen-validate
        name: validate the example pollen config
        entry: cargo run --quiet --package pollen -- validate --config-only
        language: system
        files: ^examples/pollen\.yaml$

      - id: pollen-schema
        name: regenerate the config JSON Schema
        entry: scripts/generate-schema.sh
        language: system
        pass_filenames: false
        files: ^(pollen/src/config/.*\.rs|pollen/src/schema\.rs|schema/pollen\.schema\.json)$

      - id: docs-biome
        name: biome check the documentation site
        entry: npm --prefix docs run lint
        language: system
        pass_filenames: false
        files: ^docs/

      - id: docs-astro-check
        name: astro check the documentation site
        entry: npm --prefix docs run check
        language: system
        pass_filenames: false
        files: ^docs/
