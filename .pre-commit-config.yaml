# The test suite is deliberately absent: it runs in the `quality` workflow,
# not on every commit.
default_install_hook_types:
  - pre-commit
  - commit-msg

# Without this, every hook also runs at commit-msg, against the message file.
default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        exclude: ^docs/package-lock\.json$
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        # Warning-level rules are printed and then ignored without this.
        args:
          - --strict

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock
        files: ^pollen-py/(pyproject\.toml|uv\.lock)$
        args:
          - --project
          - pollen-py

  - repo: local
    hooks:
      - id: no-co-authors
        name: no co-authors in commit message
        entry: '^\s*co-authored-by:|\bgenerated with\b'
        language: pygrep
        args:
          - --ignore-case
        stages:
          - commit-msg

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check --
        language: system
        types:
          - rust

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        pass_filenames: false
        types:
          - rust

      - id: pyright
        name: pyright the Python bindings
        # The stubs and tests are checked against the sources, so the
        # extension itself is not built.
        entry: uv run --directory pollen-py --only-group dev pyright
        language: system
        pass_filenames: false
        files: ^pollen-py/.*\.pyi?$

      - id: license-copy
        name: the Python package's LICENSE matches the repository's
        entry: cmp LICENSE pollen-py/LICENSE
        language: system
        pass_filenames: false
        files: ^(LICENSE|pollen-py/LICENSE)$

      - id: pollen-validate
        name: validate the example pollen config
        entry: cargo run --quiet --package pollen -- validate --config-only
        language: system
        files: ^examples/pollen\.yaml$

      - id: pollen-schema
        name: regenerate the config JSON Schema
        entry: scripts/generate-schema.sh
        language: system
        pass_filenames: false
        files: ^(pollen/src/config\.rs|pollen/src/schema\.rs|schema/pollen\.schema\.json)$

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types:
          - shell

      - id: docs-biome
        name: biome check the documentation site
        entry: npm --prefix docs run lint
        language: system
        pass_filenames: false
        files: ^docs/

      - id: docs-astro-check
        name: astro check the documentation site
        entry: npm --prefix docs run check
        language: system
        pass_filenames: false
        files: ^docs/
