name: quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: cache the cargo build
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7  # v2.9.2

      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: docs/.nvmrc

      # The docs hooks run Biome and astro check from the site's lockfile.
      - name: install the documentation site's dependencies
        run: npm ci --prefix docs

      - name: install pre-commit
        run: pipx install pre-commit

      - name: run every hook
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: cache the cargo build
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7  # v2.9.2

      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: run the test suite
        run: cargo test --all-targets --locked

  homebrew-formula:
    name: homebrew formula
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: check the rendered formula
        run: tests/homebrew-formula.sh

  docs-test:
    name: docs test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: docs/.nvmrc

      - name: install the dependencies
        run: npm ci

      - name: run the documentation site's tests
        run: npm test
