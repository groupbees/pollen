name: quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: cache the cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3

      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: docs/.nvmrc

      # The docs hooks run Biome and astro check from the site's lockfile.
      - name: install the documentation site's dependencies
        run: npm ci --prefix docs

      # The pyright hook runs through uv.
      - name: set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: install pre-commit
        run: pipx install pre-commit

      - name: run every hook
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: cache the cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3

      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: run the test suite
        run: cargo test --all-targets --locked

  # GitHub Free runs 5 macOS jobs at a time across the whole organisation, so
  # a pull request builds the release binaries only when their inputs change.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      binaries: ${{ github.event_name != 'pull_request' || steps.filter.outputs.binaries == 'true' }}
    steps:
      - name: list the changed paths
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            binaries:
              - pollen/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - .cargo/**
              - .github/workflows/binaries.yaml
              - .github/workflows/quality.yaml

  # The release builds, so a target that stops building fails here rather
  # than on the tag.
  binaries:
    name: binaries
    needs:
      - changes
    if: ${{ needs.changes.outputs.binaries == 'true' }}
    uses: ./.github/workflows/binaries.yaml

  # The required check for the release builds: a skipped matrix of a called
  # workflow never reports its per-target checks, so the ruleset waits on this
  # job instead.
  binaries-result:
    name: binaries result
    needs:
      - changes
      - binaries
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: fail when a release build failed
        env:
          CHANGES: ${{ needs.changes.result }}
          BINARIES: ${{ needs.binaries.result }}
        run: |
          if [ "$CHANGES" != success ] || { [ "$BINARIES" != success ] && [ "$BINARIES" != skipped ]; }; then
            echo "changes: ${CHANGES}, binaries: ${BINARIES}" >&2
            exit 1
          fi

  python:
    name: python (${{ matrix.runner }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - windows-2025
        # The oldest Python the abi3 wheel supports, and the newest.
        python:
          - "3.11"
          - "3.14"
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: pollen-py
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: cache the cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3

      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: build the bindings and run their tests
        run: uv run --locked pytest

  litellm:
    name: litellm
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: cache the cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3

      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: deploy skills from a LiteLLM proxy
        run: tests/litellm.sh

  homebrew-formula:
    name: homebrew formula
    # brew style and brew audit need no macOS, and macOS runners are scarce.
    runs-on: ubuntu-24.04
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: put the runner's Homebrew on PATH
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"

      - name: check the rendered formula
        run: tests/homebrew-formula.sh

  docs-test:
    name: docs test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: docs/.nvmrc

      - name: install the dependencies
        run: npm ci

      - name: run the documentation site's tests
        run: npm test
