name: renovate

on:
  schedule:
    # Daily, so security updates and dashboard requests are not held for the
    # weekly window renovate.json sets for the other updates.
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Look up updates without opening or changing any pull request
        type: boolean
        default: false
      logLevel:
        description: Renovate log level
        type: choice
        options:
          - info
          - debug
        default: info

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-24.04
    steps:
      - name: run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774  # v46.3.14
        with:
          # Not GITHUB_TOKEN: a pull request it opens triggers no workflow, so
          # Renovate's PRs would arrive with no CI.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          # Updating mise.lock runs `mise lock`, which Renovate otherwise refuses,
          # and then leaves mise.toml unchanged too.
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: mise
