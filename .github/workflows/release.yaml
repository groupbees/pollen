name: release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: derive the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          committed="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [ "$committed" != "$version" ]; then
            echo "Cargo.toml says ${committed} but the tag says ${version}." >&2
            echo "Cut releases with scripts/release.sh so the two stay in step." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  binaries:
    name: binaries
    needs:
      - version
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15
            target: x86_64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      ARCHIVE: pollen-${{ matrix.target }}-v${{ needs.version.outputs.version }}
      BINARY: pollen${{ endsWith(matrix.target, '-windows-msvc') && '.exe' || '' }}
      FORMAT: ${{ endsWith(matrix.target, '-windows-msvc') && 'zip' || 'tar.gz' }}
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"

      - name: build the release binary
        run: cargo build --release --locked --target "$TARGET"

      # The x86_64 macOS binary is cross-built on Apple Silicon and runs here
      # under Rosetta 2, which the macos-15 image ships.
      - name: check that the binary runs
        run: '"target/${TARGET}/release/${BINARY}" --version'

      - name: package the archive
        run: |
          mkdir "$ARCHIVE"
          cp "target/${TARGET}/release/${BINARY}" LICENSE README.md "$ARCHIVE/"
          if [ "$FORMAT" = zip ]; then
            # Git Bash's GNU tar cannot write a zip; the bsdtar Windows ships can.
            "$(cygpath "$SYSTEMROOT")/System32/tar.exe" -a -cf "${ARCHIVE}.zip" "$ARCHIVE"
          else
            # BSD tar on macOS otherwise adds AppleDouble `._*` entries.
            COPYFILE_DISABLE=1 tar -czf "${ARCHIVE}.tar.gz" "$ARCHIVE"
          fi

      - name: keep the archive for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.${{ env.FORMAT }}
          if-no-files-found: error

  publish:
    name: publish
    needs:
      - version
      - binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: collect the archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: write the checksums
        working-directory: artifacts
        run: sha256sum -- *.tar.gz *.zip > SHA256SUMS

      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes artifacts/*
