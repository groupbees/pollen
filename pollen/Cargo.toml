[package]
name = "pollen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Deploy Agent Skills from git repositories and local directories, declaratively"
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "../README.md"
keywords = ["agent-skills", "claude-code", "cli", "git"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
dirs = "6.0.0"
hex = "0.4.3"
regex = "1.13.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "fs", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
validator = { version = "0.21.0", features = ["derive"] }
walkdir = "2.5.0"

[dev-dependencies]
jsonschema = { version = "0.60.1", default-features = false }
mockall = "0.15.0"

[lints]
workspace = true
