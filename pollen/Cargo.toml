[package]
name = "pollen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Deploy Agent Skills from git repositories, local directories and well-known indexes, declaratively"
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "../README.md"
keywords = ["agent-skills", "claude-code", "cli", "git"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
dirs = "6.0.0"
flate2 = "1.1.11"
hex = "0.4.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "system-proxy"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "fs", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
validator = { version = "0.21.0", features = ["derive"] }
walkdir = "2.5.0"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }

# SChannel on Windows: ring's C sources do not build for MSVC from another
# host, which would break the cross-target clippy run CONTRIBUTING.md describes.
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
jsonschema = { version = "0.61.1", default-features = false }
mockall = "0.15.0"
wiremock = "0.6.5"

[lints]
workspace = true
