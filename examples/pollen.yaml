# yaml-language-server: $schema=https://raw.githubusercontent.com/groupbees/pollen/main/schema/pollen.schema.json
#
# Every key pollen understands, with its default in a comment.

# The format version this file is written in. Default: 1, where each
# `skills:` list of a `repo` is called `paths:`. `pollen migrate` rewrites an
# older file in the newest version.
version: 2

# Where the skills are deployed; each directory gets a full copy. A relative
# path resolves against the working directory, and `~` is expanded.
# Default: .claude/skills (what Claude Code reads) and .agents/skills (the
# cross-client convention every other Agent Skills client scans).
targets:
  - .claude/skills
  - .agents/skills

repos:
  # A git repository, pinned to a tag, a branch or a commit.
  - repo: https://github.com/toto/tata
    revision: 1.2.3
    skills:  # where to look, each with a `path`
      # Every directory under `mydir/` that holds a SKILL.md, at any depth,
      # except the ones whose path under `mydir/` starts with `toto`.
      - path: mydir/
        recurse: true  # default: false, i.e. immediate children only
        exclude: ^toto  # default: none

  # A plugin repository: its skills sit under `<plugin>/skills/`, which
  # `recurse: true` finds without naming each plugin.
  - repo: git@github.com:acme/agent-plugins.git
    revision: main
    skills:
      - path: plugins
        recurse: true

  # `local` reads the directory holding this file, and takes no revision.
  - repo: local
    skills:
      - path: skills

  # An origin serving /.well-known/agent-skills/index.json: every skill it
  # lists, except the ones whose name matches `exclude`.
  - well-known: https://skills.example.org
    exclude: ^experimental-  # default: none

  # The same kind of source, taking only the listed skills. A `digest` pins
  # the artifact; `pollen autoupdate --freeze` writes it. Tokens for an origin
  # go in ~/.config/pollen/credentials.yaml, never here.
  - well-known: https://gateway.example.com
    skills:
      - name: pdf-summarizer
        digest: sha256:3f2a9c0d5b8e7f41a6c2d9e0b1f3a4c5d6e7f8091a2b3c4d5e6f708192a3b4c5
      - name: code-review  # no digest: follows what the index publishes
