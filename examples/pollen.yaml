# yaml-language-server: $schema=https://raw.githubusercontent.com/groupbees/pollen/main/schema/pollen.schema.json
#
# Every key pollen understands, with its default in a comment.

# The format version this file is written in. Default: 1, where each
# `skills:` list of a `repo` is called `paths:` and each `discovery` origin is
# a `well-known:` entry of `repos`. `pollen config migrate` rewrites an older
# file in the newest version.
version: 2

# The clients an entry naming neither `clients` nor `targets` deploys for:
# `claude-code` (skills in .claude/skills) and `opencode` (skills in
# .agents/skills, the cross-client convention most other Agent Skills clients
# scan too). Under the home directory with --global. Default: all, every
# client this pollen knows.
clients: all

repos:
  # A git repository, pinned to a tag, a branch or a commit.
  - repo: https://github.com/toto/tata
    revision: 1.2.3
    skills:  # where to look, each with a `path`
      # Every directory under `mydir/` that holds a SKILL.md, at any depth,
      # except the ones whose path under `mydir/` starts with `toto`.
      - path: mydir/
        recurse: true  # default: false, i.e. immediate children only
        exclude: ^toto  # default: none
        # The clients these skills are deployed for, one or a list, in place
        # of the top-level `clients`. Not with `targets`.
        clients:
          - claude-code
          - opencode

  # A plugin repository: its skills sit under `<plugin>/skills/`, which
  # `recurse: true` finds without naming each plugin.
  - repo: git@github.com:acme/agent-plugins.git
    revision: main
    skills:
      - path: plugins
        recurse: true

  # `local` reads the directory holding this file, and takes no revision.
  - repo: local
    skills:
      - path: skills
        # Directories of your own, in place of any client's skill directory;
        # each gets a full copy. A relative path resolves against the working
        # directory, and `~` is expanded. Not with `clients`.
        targets:
          - ~/team/skills

# Origins serving an Agent Skills discovery index,
# /.well-known/agent-skills/index.json. A file needs `repos`, `discovery`, or
# both.
discovery:
  # Every skill the index lists, except the ones whose name matches `exclude`.
  - url: https://skills.example.org  # an origin: no path
    exclude: ^experimental-  # default: none
    clients: opencode  # or `targets`, as on a `skills` item

  # Only the listed skills. A `digest` pins the artifact;
  # `pollen autoupdate --freeze` writes it. Tokens for an origin go in
  # ~/.config/pollen/credentials.yaml, never here.
  - url: https://gateway.example.com
    skills:
      - name: pdf-summarizer
        digest: sha256:3f2a9c0d5b8e7f41a6c2d9e0b1f3a4c5d6e7f8091a2b3c4d5e6f708192a3b4c5
      - name: code-review  # no digest: follows what the index publishes
